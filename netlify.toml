# Netlify configuration for the Ahed website.
# Vite + React app: `npm run build` writes the site to /dist and pre-renders every page to its own HTML file
# (see the end of this file). React Router takes over in the browser for navigation between pages.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"
  # This Netlify project was first set up when the site used Next.js, so Netlify still adds its Next.js
  # Runtime plugin (@netlify/plugin-nextjs), which fails on a Vite build ("publish directory does not contain
  # expected Next.js build output"). This switches that plugin off. Also remove it in the Netlify UI:
  # Project configuration → Build & deploy → Build plugins (and set the framework to Vite / none).
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Vite bundles in /assets have a content hash in their file names and never change: cache for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and logos keep their file names, so a replaced photo would show its old version until this runs out:
# 1 day, then the browser checks for a new one. (Use a new file name to have a change show straight away.)
# Pages (HTML), robots.txt and sitemap.xml keep Netlify's default: always re-checked, so deploys show at once.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Security headers for every page.
# Content-Security-Policy: only this site's own scripts, styles, fonts and images may load.
#   style-src 'unsafe-inline': the site menu renders a <style> tag. font-src data:: some Manrope subsets are
#   inlined in the CSS. connect-src dns.google: the contact form's email-domain check (src/lib/email-check.js).
#   WhatsApp (wa.me) links are normal navigation, not covered by this. Add any new outside service here first.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://dns.google; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The hidden copy of the contact form (for Netlify Forms) is not a page: keep it out of search results
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Old static-site URLs: service-*.html moved to /services/<slug>, other pages lost their .html

[[redirects]]
  from = "/service-strategy-advisory.html"
  to = "/services/strategy-advisory"
  status = 301

[[redirects]]
  from = "/service-performance-improvement.html"
  to = "/services/performance-improvement"
  status = 301

[[redirects]]
  from = "/service-people-and-change.html"
  to = "/services/people-and-change"
  status = 301

[[redirects]]
  from = "/service-digital-and-innovation.html"
  to = "/services/digital-and-innovation"
  status = 301

[[redirects]]
  from = "/service-finance-and-accounting.html"
  to = "/services/finance-and-accounting"
  status = 301

[[redirects]]
  from = "/service-managed-services.html"
  to = "/services/managed-services"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
