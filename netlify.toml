# Pages: every page is pre-rendered at build time (scripts/prerender.mjs), which also writes dist/_redirects with
# one rewrite per page ("/about  /_pages/about.html  200!"); Netlify applies _redirects before the rules above.
# There is deliberately no catch-all "/* → /index.html" rule any more: unknown addresses get dist/404.html with a
# real 404 status (better for search engines than a "soft 404"). Add new pages to src/lib/pages.js.
